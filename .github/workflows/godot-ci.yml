name: Parasite Evolution — Godot CI / Android debug

on:
  push:
    branches: [main, "gpt/**", "claude/**"]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-ci.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Import + economy + headless boot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.4.1'
          use-dotnet: false
      - name: Godot import
        run: godot --headless --path godot --import
      - name: Rule and save-model tests
        run: godot --headless --path godot --script res://tests/economy_test.gd
      - name: Full gameplay and joystick smoke
        run: godot --headless --path godot --script res://tests/gameplay_smoke.gd
      - name: Boot game and inspect runtime log
        run: |
          set -o pipefail
          godot --headless --path godot --quit-after 120 2>&1 | tee godot-boot.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Failed to load script' godot-boot.log; then
            echo 'Godot runtime reported script errors'
            exit 1
          fi
  android:
    name: Android ARM64 debug APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.4.1'
          use-dotnet: false
          include-templates: true
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools" "build-tools;35.0.1" "platforms;android-35"
      - name: Configure Godot export paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
      - name: Generate ephemeral debug key
        run: |
          keytool -genkeypair -noprompt -v             -keystore "$RUNNER_TEMP/parasite-debug.jks"             -alias androiddebugkey -storepass android -keypass android             -keyalg RSA -keysize 2048 -validity 365             -dname "CN=Parasite Evolution Debug, OU=Development, O=Prototype, C=PL"
      - name: Build debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/parasite-debug.jks
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p godot/build
          godot --headless --path godot --import
          godot --headless --path godot --export-debug Android build/parasite-evolution-debug.apk
          test -s godot/build/parasite-evolution-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose             godot/build/parasite-evolution-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Parasite-Evolution-Godot-Android-debug
          path: godot/build/parasite-evolution-debug.apk
          if-no-files-found: error
          retention-days: 14
